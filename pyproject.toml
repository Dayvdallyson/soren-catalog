[project]
name = "soren-catalog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dayvdallyson", email = "dayvdallyson21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "redis",
    "rq",
    "meilisearch",
    "pydantic-settings",
]

[project.scripts]
soren-catalog = "soren_catalog:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
